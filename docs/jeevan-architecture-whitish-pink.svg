<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Jeevan Smart Healthcare System Architecture</title>
  <desc id="desc">Soft pink architecture diagram showing VitaWatch and Smart Walking Stick connected to the Flutter app, FastAPI backend, external services, and Supabase.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffafa"/>
      <stop offset="1" stop-color="#fdecef"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffefe"/>
      <stop offset="1" stop-color="#fff4f6"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9b9c9"/>
      <stop offset="1" stop-color="#e986a2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#b75d78" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#c86683"/>
    </marker>
    <style>
      .title { font: 800 42px Arial, sans-serif; fill: #5b2638; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #8d5b6b; }
      .heading { font: 800 24px Arial, sans-serif; fill: #652d42; }
      .label { font: 700 20px Arial, sans-serif; fill: #652d42; }
      .body { font: 400 17px Arial, sans-serif; fill: #7d5362; }
      .small { font: 400 15px Arial, sans-serif; fill: #936777; }
      .card { fill: url(#card); stroke: #efb4c3; stroke-width: 2; }
      .core-card { fill: url(#core); stroke: #d66e8e; stroke-width: 2; }
      .line { stroke: #c86683; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #d894a8; stroke-width: 2.5; stroke-dasharray: 9 8; fill: none; marker-end: url(#arrow); }
      .pill { fill: #f9dbe3; stroke: #edacbd; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1450" cy="120" r="180" fill="#f8d8e1" opacity=".42"/>
  <circle cx="100" cy="900" r="230" fill="#f8d8e1" opacity=".36"/>

  <text x="800" y="70" text-anchor="middle" class="title">Jeevan Smart Healthcare Ecosystem</text>
  <text x="800" y="106" text-anchor="middle" class="subtitle">Real-time monitoring • AI assistance • Emergency response • Smart mobility</text>

  <!-- Devices -->
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="350" height="230" rx="24" class="card"/>
    <rect x="1180" y="180" width="350" height="230" rx="24" class="card"/>
  </g>
  <text x="245" y="220" text-anchor="middle" class="heading">VitaWatch ESP32</text>
  <text x="245" y="252" text-anchor="middle" class="body">Wearable health monitor</text>
  <text x="105" y="292" class="body">• MAX30102: HR and SpO₂</text>
  <text x="105" y="321" class="body">• MAX30205 / DHT11: temperature</text>
  <text x="105" y="350" class="body">• AD8232: single-lead ECG</text>
  <text x="105" y="379" class="body">• GPS, SOS and medicine buttons</text>

  <text x="1355" y="220" text-anchor="middle" class="heading">Smart Walking Stick</text>
  <text x="1355" y="252" text-anchor="middle" class="body">ESP32 mobility and safety device</text>
  <text x="1215" y="292" class="body">• Left, front and right ultrasonic sensors</text>
  <text x="1215" y="321" class="body">• LDR-controlled safety headlight</text>
  <text x="1215" y="350" class="body">• GPS, speed and heading tracking</text>
  <text x="1215" y="379" class="body">• Geofence and emergency events</text>

  <!-- App -->
  <g filter="url(#shadow)">
    <rect x="505" y="180" width="590" height="230" rx="28" class="core-card"/>
  </g>
  <text x="800" y="223" text-anchor="middle" class="heading">Flutter Android Application</text>
  <text x="800" y="254" text-anchor="middle" class="body">User interface and real-time health dashboard</text>
  <rect x="545" y="282" width="150" height="38" rx="19" class="pill"/>
  <rect x="715" y="282" width="150" height="38" rx="19" class="pill"/>
  <rect x="885" y="282" width="150" height="38" rx="19" class="pill"/>
  <text x="620" y="307" text-anchor="middle" class="small">VitaWatch</text>
  <text x="790" y="307" text-anchor="middle" class="small">Smart Stick</text>
  <text x="960" y="307" text-anchor="middle" class="small">Emergency SOS</text>
  <text x="545" y="357" class="body">AI Assistant • Health Vault • Medications • Maps</text>
  <text x="545" y="386" class="body">Telemedicine • Clinical Tools • Emergency QR</text>

  <!-- Top connections -->
  <path d="M420 295 H505" class="line"/>
  <text x="462" y="278" text-anchor="middle" class="small">BLE / Wi-Fi</text>
  <path d="M1180 295 H1095" class="line"/>
  <text x="1137" y="278" text-anchor="middle" class="small">Wi-Fi / JSON</text>

  <!-- Backend -->
  <g filter="url(#shadow)">
    <rect x="405" y="520" width="790" height="220" rx="28" class="core-card"/>
  </g>
  <text x="800" y="565" text-anchor="middle" class="heading">FastAPI Backend</text>
  <text x="800" y="596" text-anchor="middle" class="body">Secure APIs, real-time hub and device-state management</text>
  <rect x="445" y="630" width="210" height="48" rx="14" class="pill"/>
  <rect x="695" y="630" width="210" height="48" rx="14" class="pill"/>
  <rect x="945" y="630" width="210" height="48" rx="14" class="pill"/>
  <text x="550" y="660" text-anchor="middle" class="small">REST APIs</text>
  <text x="800" y="660" text-anchor="middle" class="small">WebSocket / SSE Hub</text>
  <text x="1050" y="660" text-anchor="middle" class="small">Authentication &amp; Security</text>
  <text x="800" y="710" text-anchor="middle" class="body">Device telemetry • SOS • geofencing • AI streaming • persistence</text>

  <path d="M800 410 V520" class="line"/>
  <text x="830" y="475" class="small">REST / WebSocket / SSE</text>

  <!-- Integrations -->
  <g filter="url(#shadow)">
    <rect x="70" y="820" width="510" height="115" rx="22" class="card"/>
    <rect x="640" y="820" width="510" height="115" rx="22" class="card"/>
    <rect x="1210" y="820" width="320" height="115" rx="22" class="card"/>
  </g>
  <text x="325" y="858" text-anchor="middle" class="heading">AI and Clinical Services</text>
  <text x="325" y="890" text-anchor="middle" class="body">Gemini • OpenAI • Hugging Face • Hybrid RAG</text>
  <text x="325" y="916" text-anchor="middle" class="small">FastEmbed • BM25 • ONNX reranking • OpenFDA</text>

  <text x="895" y="858" text-anchor="middle" class="heading">Emergency Integrations</text>
  <text x="895" y="890" text-anchor="middle" class="body">TomTom • Agora RTC • Brevo</text>
  <text x="895" y="916" text-anchor="middle" class="small">Hospitals • traffic • video • SMS • email • WhatsApp</text>

  <text x="1370" y="858" text-anchor="middle" class="heading">Supabase</text>
  <text x="1370" y="890" text-anchor="middle" class="body">Auth • PostgreSQL</text>
  <text x="1370" y="916" text-anchor="middle" class="small">Storage • RLS • Realtime</text>

  <path d="M620 740 V790 H325 V820" class="dashed"/>
  <path d="M800 740 V820" class="dashed"/>
  <path d="M980 740 V790 H1370 V820" class="dashed"/>

  <text x="800" y="978" text-anchor="middle" class="small">Jeevan • Connected healthcare, emergency response and smart mobility</text>
</svg>
